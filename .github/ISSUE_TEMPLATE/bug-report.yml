name: 🐞 Final Cut Pro 버그 제보
description: 겪고 있는 Final Cut Pro 버그를 알려 주세요. 정리해서 Apple에 전달합니다.
labels: ["bug", "fcp-report"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다! 모인 제보는 정리하여 [Apple Feedback](https://www.apple.com/feedback/finalcutpro/)으로 전달됩니다.
  - type: input
    id: fcp-version
    attributes:
      label: Final Cut Pro 버전
      placeholder: "예: 12.3"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 버전 / 기기
      placeholder: "예: macOS 26.2 / MacBook Pro M4"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 무엇을 했고, 무엇을 기대했고, 실제로는 어떻게 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. …
        2. …
        3. …
  - type: input
    id: plugins
    attributes:
      label: 사용 중인 서드파티 플러그인 (있다면)
      placeholder: "예: MotionVFX mTitle, CoreMelt TrackX"
