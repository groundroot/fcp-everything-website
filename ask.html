<!DOCTYPE html>

<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/config.js" defer></script>
<script src="assets/js/i18n.js" defer></script>

<body data-page="ask">
<header class="site"><div class="bar">
  <a class="logo" href="index.html">fcpe<span class="dot">.</span>com</a>
  <nav class="main">
    <a href="ask.html" class="on" data-i18n="nav.ask"></a>
    <a href="guide.html" data-i18n="nav.guide"></a>
    <a href="issues.html" data-i18n="nav.issues"></a>

  </nav>

<main class="wrap">
  <div class="chat">
    <h1 class="page" data-i18n="ask.title" data-i18n-title="ask.title"></h1>
    <p class="lead" data-i18n="ask.lead"></p>

    <div class="suggestions">
      <button data-i18n="ask.s1"></button>
      <button data-i18n="ask.s2"></button>
      <button data-i18n="ask.s3"></button>
      <button data-i18n="ask.s4"></button>
    </div>

    <div id="chat-log" class="chat-log"></div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" autocomplete="off" data-i18n-ph="ask.placeholder">
      <button type="submit" data-i18n="ask.send"></button>
    </form>
  </div>
</main>

<footer class="site"><div class="wrap">
  <span data-i18n="footer.tagline"></span>
